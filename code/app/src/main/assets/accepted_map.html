<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accepted Entrants Map</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
  />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    #status {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 16px;
      border-radius: 16px;
      font-family: sans-serif;
      font-size: 14px;
      color: #000;
      display: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    let map = L.map('map').setView([0, 0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let markersLayer = L.markerClusterGroup();
    map.addLayer(markersLayer);

    const statusEl = document.getElementById('status');

    function showStatus(message) {
      if (!statusEl) return;
      statusEl.textContent = message;
      statusEl.style.display = 'block';
    }

    function hideStatus() {
      if (!statusEl) return;
      statusEl.style.display = 'none';
    }

    // Called from Android via evaluateJavascript("window.showMarkers([...])")
    window.showMarkers = function(markerData) {
      try {
        markersLayer.clearLayers();

        if (!markerData || markerData.length === 0) {
          showStatus('No locations recorded for enrolled entrants yet.');
          return;
        }

        hideStatus();

        const bounds = [];

        markerData.forEach(function (m) {
          if (typeof m.lat !== 'number' || typeof m.lng !== 'number') {
            return;
          }
          const marker = L.marker([m.lat, m.lng]);
          let popup = '';
          if (m.title) popup += '<strong>' + m.title + '</strong><br>';
          if (m.snippet) popup += m.snippet;
          if (popup) marker.bindPopup(popup);
          markersLayer.addLayer(marker);
          bounds.push([m.lat, m.lng]);
        });

        if (bounds.length > 0) {
          const latLngBounds = L.latLngBounds(bounds);
          map.fitBounds(latLngBounds.pad(0.1));
        } else {
          showStatus('No valid locations to display.');
        }
      } catch (e) {
        showStatus('Error displaying map markers.');
        console.error(e);
      }
    };

    // In case Android wants to push raw status text
    window.showStatus = function(message) {
      showStatus(message);
    };
  </script>
</body>
</html>
